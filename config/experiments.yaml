# The default experiment: one condition against the baseline, with Claude Code.
#
# It works immediately after `hmb setup`, because `demo-kit` is vendored in this
# repository. Copy this file (or run `hmb experiment new <name>`) rather than
# editing it in place — a scenario is a separate file, so a command line names
# the experiment it belongs to.

source_root: source-tasks/terminal-bench   # where benchmark tasks are read from
generated_root: generated                  # where task variants are written
repetitions: 1                             # documents the design; the runner
                                           # takes the real count from --attempts

models:
  claude-code: claude-sonnet-5
  codex: gpt-5.6-terra

# Names dropped from every toolkit payload before it enters a container.
# Override per toolkit with an `exclude:` key.
snapshot_excludes: [".git", ".venv", "venv", "node_modules", "__pycache__",
                    ".ruff_cache", ".pytest_cache", ".mypy_cache", ".tox", ".DS_Store"]

# Directories inside a toolkit that hold installable agent skills, in precedence
# order. The first source providing a given skill name wins.
skill_sources: [".claude/skills", ".agents/skills", "skills"]

# Each entry is one experimental condition. The `baseline` condition — the task
# and nothing else — is always generated and must not be declared here.
#
# Optional per-toolkit keys:
#   exclude:              names dropped at any depth (defaults to snapshot_excludes)
#   include:              allowlist of top-level snapshot entries
#   expect_instructions:  must a CLAUDE.md / AGENTS.md reach the agent workdir?
#   expect_skills:        must the toolkit's skills be installed for the agent?
#   skill_sources:        override the global skill_sources for this toolkit
#
# Both `expect_*` flags are asserted in both directions by `validate` and
# `preflight`, which is what makes a subtractive condition safe. See
# config/experiments.scenarios.yaml for a worked example.
toolkits:
  - id: demo-kit
    snapshot: toolkits/demo-kit/snapshot

  # Declare your own toolkit by adding it to config/sources.yaml, running
  # `hmb setup`, and uncommenting an entry like this one:
  # - id: sdd
  #   snapshot: toolkits/sdd/snapshot

# The cells the runners execute. Every `toolkit` must be `baseline` or an id
# declared above; every `agent` must appear in `models`.
matrix:
  - {id: claude-baseline, agent: claude-code, toolkit: baseline}
  - {id: claude-demo-kit, agent: claude-code, toolkit: demo-kit}

  # Add the second agent only once `hmb doctor` reports its CLI as present and
  # its quota as real — an exhausted quota fails every trial before the agent
  # reaches the task.
  # - {id: codex-baseline, agent: codex, toolkit: baseline}
  # - {id: codex-demo-kit, agent: codex, toolkit: demo-kit}
