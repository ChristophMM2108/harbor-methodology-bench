# CodeZen vs SDD vs no methodology
# ---------------------------------
# Four conditions crossed with two agent CLIs, three attempts per cell.
#
# The question is whether a repository-carried engineering method changes a
# coding agent's measured performance, and whether two methods that make
# different claims separate from each other. `baseline` is the control: the
# benchmark task and nothing else.
#
# CodeZen appears twice on purpose. It ships eleven skills, of which seven need
# something a benchmark container does not have — a Docker daemon, a running
# system under test, interactive input, or an MCP server. Running only the full
# payload would leave a null result unattributable: unclear whether the method
# does not help or whether most of it never ran. So:
#
#   codezen-full    the plugin as shipped; measures the method *and* its
#                   portability to an environment it was not built for
#   codezen-viable  only the four skills that can run in a plain checkout;
#                   measures the method alone
#
# Both are cut from the same snapshot and the same GIT_SHA, so the difference
# between them is exactly the seven excluded skills and nothing else.

source_root: source-tasks/terminal-bench
generated_root: generated
repetitions: 3                             # the README's stated minimum for a
                                           # reportable confidence interval

models:
  claude-code: claude-sonnet-5
  codex: gpt-5.6-terra

snapshot_excludes: [".git", ".venv", "venv", "node_modules", "__pycache__",
                    ".ruff_cache", ".pytest_cache", ".mypy_cache", ".tox", ".DS_Store"]

skill_sources: [".claude/skills", ".agents/skills", "skills"]

toolkits:
  - id: sdd
    snapshot: toolkits/sdd/snapshot

  - id: codezen-full
    snapshot: toolkits/codezen/snapshot

  - id: codezen-viable
    snapshot: toolkits/codezen/snapshot
    # `exclude` drops matching names at any depth, and each of these names
    # resolves to exactly two paths in the snapshot — the skill's directory
    # under .claude/skills and under .agents/skills. Verified: no file in
    # standards/ or plugin/ shares a name with any entry below.
    #
    # Dropped, and why each one cannot run in a benchmark container:
    #   tdd, fix          launch a Docker sandbox; no daemon inside the container
    #   setup             interactive credential manager
    #   brainstorm        requires a human in the dialogue
    #   agentic-e2e       drives a running system under test
    #   sut-bootstrap     bootstraps a running system under test
    #   to-notion         requires the Notion MCP server
    #
    # Kept: noc-tdd, noc-fix, code-review, security-review.
    exclude: [".git", ".venv", "venv", "node_modules", "__pycache__",
              ".ruff_cache", ".pytest_cache", ".mypy_cache", ".tox", ".DS_Store",
              "tdd", "fix", "setup", "brainstorm",
              "agentic-e2e", "sut-bootstrap", "to-notion"]

matrix:
  - {id: claude-baseline,       agent: claude-code, toolkit: baseline}
  - {id: claude-sdd,            agent: claude-code, toolkit: sdd}
  - {id: claude-codezen-full,   agent: claude-code, toolkit: codezen-full}
  - {id: claude-codezen-viable, agent: claude-code, toolkit: codezen-viable}
  - {id: codex-baseline,        agent: codex,       toolkit: baseline}
  - {id: codex-sdd,             agent: codex,       toolkit: sdd}
  - {id: codex-codezen-full,    agent: codex,       toolkit: codezen-full}
  - {id: codex-codezen-viable,  agent: codex,       toolkit: codezen-viable}
