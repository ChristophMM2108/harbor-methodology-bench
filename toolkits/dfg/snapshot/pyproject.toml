[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-perf"
version = "0.1.0"
description = "harness-perf — bootstrapped via dfg-harness v0.11.71"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_perf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
