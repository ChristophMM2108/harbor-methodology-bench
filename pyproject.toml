[project]
name = "harbor-methodology-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christoph Mitschka", email = "christoph.mitschka@korza.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[project.scripts]
harbor-methodology-bench = "harbor_methodology_bench.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Result analysis: results/analysis/prog16_analysis.ipynb and its extraction module.
# Not needed to build, validate or run an experiment.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
